name: IPO scan
on:
  # Primary trigger: the Cloudflare Worker cron dispatches `channel` at 9:30 IST
  # and `bot` at 14:30 IST (GitHub's own cron runs late, often by an hour or more).
  repository_dispatch:
    types: [channel, bot]
  # Fallback only. Runs are idempotent and skip once today's run is done;
  # past the deadline (13:00 channel / 16:30 bot) they alert the admin instead.
  schedule:
    - cron: "20 4 * * 1-5"   # 09:50 IST -> channel
    - cron: "20 9 * * 1-5"   # 14:50 IST -> bot
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [channel, bot]
        default: channel
      dry_run:
        type: boolean
        default: true
      force:
        type: boolean
        default: false

concurrency:
  group: ipo-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Refresh data/ from the branch tip
        # A queued run checks out the commit it was triggered on; the sent log
        # must be the newest one or a fallback run could re-send.
        run: |
          git fetch origin "${GITHUB_REF_NAME}" --depth=1
          git checkout FETCH_HEAD -- data/ || true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick mode
        id: m
        run: |
          flags=""
          case "${{ github.event_name }}" in
            repository_dispatch) mode="${{ github.event.action }}" ;;
            workflow_dispatch)
              mode="${{ inputs.mode }}"
              [ "${{ inputs.dry_run }}" = "true" ] && flags="$flags --dry-run"
              [ "${{ inputs.force }}" = "true" ] && flags="$flags --force"
              ;;
            schedule)
              if [ "${{ github.event.schedule }}" = "20 4 * * 1-5" ]; then mode=channel; else mode=bot; fi ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
          EXPORT_SECRET: ${{ secrets.EXPORT_SECRET }}
          IPOGURU_API_KEY: ${{ secrets.IPOGURU_API_KEY }}
        run: python -m bot.run ${{ steps.m.outputs.mode }} ${{ steps.m.outputs.flags }}
      - name: Commit state
        if: always()
        run: |
          git config user.name  "ipo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/sent.json data/ipoguru_cache.json data/ipoguru_usage.json
          git diff --staged --quiet && exit 0
          git commit -m "state: $(date -u +%F_%H%M) ${{ steps.m.outputs.mode }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
