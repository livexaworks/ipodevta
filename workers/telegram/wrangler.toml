name = "ipo-devta-bot"
main = "worker.js"
compatibility_date = "2026-09-01"

# Weekdays, UTC. 04:30 UTC = 10:00 IST (channel run), 05:30 UTC = 11:00 IST (bot run).
# Each fires a GitHub repository_dispatch; worker.js CRON_EVENTS maps them.
[triggers]
crons = ["30 4 * * 1-5", "30 5 * * 1-5"]

[[kv_namespaces]]
binding = "PREFS"
id = "44fd223f49a64286baf31fea04e33218"
preview_id = "44fd223f49a64286baf31fea04e33218"

# Secrets (wrangler secret put NAME):
#   TELEGRAM_TOKEN, CHANNEL_ID, ADMIN_CHAT_ID, WEBHOOK_SECRET, EXPORT_SECRET,
#   GITHUB_TOKEN (fine-grained, this repo, Contents: read & write), GITHUB_REPO
